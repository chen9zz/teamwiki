name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teamwiki
          POSTGRES_PASSWORD: teamwiki-test-password
          POSTGRES_DB: teamwiki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamwiki -d teamwiki_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://teamwiki:teamwiki-test-password@localhost:5432/teamwiki_test
      TEST_DATABASE_URL: postgresql+asyncpg://teamwiki:teamwiki-test-password@localhost:5432/teamwiki_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: ruff check --config backend/pyproject.toml backend/app backend/tests backend/migrations scripts
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - name: Verify reversible migration
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

