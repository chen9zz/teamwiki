name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teamwiki
          POSTGRES_PASSWORD: teamwiki-test-password
          POSTGRES_DB: teamwiki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamwiki -d teamwiki_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://teamwiki:teamwiki-test-password@localhost:5432/teamwiki_test
      TEST_DATABASE_URL: postgresql+asyncpg://teamwiki:teamwiki-test-password@localhost:5432/teamwiki_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: ruff check --config backend/pyproject.toml backend/app backend/tests backend/migrations scripts
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - name: Verify reversible migration
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and exercise production document/editor chunks
        run: npm run test:production


  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated demo settings
        run: |
          cp .env.example .env
          python - <<'PY'
          import secrets
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          text = text.replace('teamwiki-local-password', secrets.token_hex(24))
          text = text.replace('replace-with-a-random-secret-of-at-least-32-characters', secrets.token_hex(32))
          path.write_text(text)
          PY
      - name: Validate, build and start complete stack
        run: |
          docker compose config --quiet
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 180
      - name: Seed and exercise frontend, API, versions, tenants and asynchronous imports
        run: |
          python scripts/seed.py --url http://127.0.0.1:8080
          python scripts/docker_smoke.py --url http://127.0.0.1:8080
          docker compose exec -T api python - <<'PYMETRICS'
          import os
          from pathlib import Path
          from urllib.request import urlopen
          folder = Path(os.environ['PROMETHEUS_MULTIPROC_DIR'])
          assert len(list(folder.glob('counter_*.db'))) == 2
          metrics = urlopen('http://127.0.0.1:8000/internal/metrics').read()
          assert b'teamwiki_http_requests_total' in metrics
          assert b'teamwiki_http_inflight 0.0' in metrics
          PYMETRICS
          docker compose exec -T redis-cache redis-cli CONFIG GET maxmemory-policy
          docker compose exec -T redis-broker redis-cli CONFIG GET maxmemory-policy
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Tear down test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
