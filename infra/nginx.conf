limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Internal process metrics are available only on the private API network.
    location = /internal/metrics { return 404; }
    location ^~ /internal/ { return 404; }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/proxy-teamwiki.conf;
    }
    location /api/ {
        include /etc/nginx/proxy-teamwiki.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
