[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamwiki-backend"
version = "0.2.0"
description = "Tenant-safe collaborative knowledge base"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7", "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "prometheus-client==0.26.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "fakeredis>=2.26,<3", "ruff>=0.9,<1", "locust>=2.32,<3"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
